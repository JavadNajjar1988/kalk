<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalk Simulator - Babylon.js</title>
    <style>
      @font-face {
        font-family: 'SimulatorUi';
        src:
          url('./fonts/Yekan.woff2') format('woff2'),
          url('./fonts/Yekan.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'SimulatorUi';
        src:
          url('./fonts/Yekan-Bold.woff2') format('woff2'),
          url('./fonts/Yekan-Bold.woff') format('woff');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: 'SimulatorUi', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #mainContainer {
        width: 100%;
        height: 100%;
        position: relative;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        margin-top: 60px;
        height: calc(100vh - 60px);
      }

      #mainContainer.visible {
        opacity: 1;
      }

      #cesiumContainer {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #babylonContainer {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        pointer-events: none;
        background: transparent;
      }

      .cesium-widget {
        width: 100% !important;
        height: 100% !important;
      }

      .cesium-widget canvas {
        width: 100% !important;
        height: 100% !important;
      }

      #splashScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-in-out;
      }

      #splashScreen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splashVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        z-index: 10001;
        display: none;
      }

      #header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.95) 0%, rgba(30, 30, 45, 0.95) 100%);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      #header.visible {
        opacity: 1;
      }

      #header .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
        font-size: 18px;
        font-weight: 600;
      }

      #header .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #header .action-button,
      #header .back-button {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }

      #header .action-button:hover,
      #header .back-button:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      #scenarioDebugPanel {
        position: fixed;
        left: 16px;
        bottom: 188px;
        z-index: 9998;
        min-width: 280px;
        max-width: 420px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(12, 18, 28, 0.86);
        color: #f7fbff;
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        font-size: 13px;
        line-height: 1.6;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      #scenarioDebugPanel strong {
        color: #8fe7ff;
      }

      #timelinePanel {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: min(1120px, calc(100vw - 32px));
        z-index: 9997;
        padding: 14px 16px 16px;
        border-radius: 18px;
        background: rgba(8, 14, 22, 0.9);
        color: #f5fbff;
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(14px);
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.34);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      #timelinePanel.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .timeline-summary {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .timeline-current-block {
        min-width: 0;
      }

      .timeline-current-label {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
      }

      .timeline-current-sublabel {
        color: rgba(230, 244, 255, 0.72);
        font-size: 12px;
        line-height: 1.7;
      }

      .timeline-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .timeline-control-button,
      .timeline-speed-select {
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: #f7fbff;
        min-height: 40px;
        font: inherit;
      }

      .timeline-control-button {
        padding: 0 16px;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .timeline-control-button:hover,
      .timeline-speed-select:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.26);
      }

      .timeline-control-button:active {
        transform: translateY(1px);
      }

      .timeline-control-button.primary {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.9), rgba(14, 165, 233, 0.82));
        border-color: rgba(143, 231, 255, 0.4);
      }

      .timeline-control-button.secondary {
        background: rgba(255, 255, 255, 0.1);
      }

      .timeline-speed-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(230, 244, 255, 0.78);
        font-size: 13px;
      }

      .timeline-speed-select {
        padding: 0 12px;
        cursor: pointer;
      }

      .timeline-track-shell {
        direction: ltr;
      }

      .timeline-edge-labels,
      .timeline-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .timeline-edge-labels {
        margin-bottom: 10px;
      }

      .timeline-edge {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .timeline-edge span,
      .timeline-footer span {
        color: rgba(230, 244, 255, 0.68);
        font-size: 11px;
      }

      .timeline-edge strong {
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
      }

      #timelineTicks {
        position: relative;
        height: 34px;
        margin-bottom: 10px;
      }

      .timeline-tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: rgba(230, 244, 255, 0.78);
        font-size: 11px;
        white-space: nowrap;
      }

      .timeline-tick::before {
        content: "";
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.26);
      }

      #timelineSlider {
        --timeline-progress: 0%;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        outline: none;
        background:
          linear-gradient(
            90deg,
            rgba(79, 209, 255, 0.96) 0%,
            rgba(79, 209, 255, 0.96) var(--timeline-progress),
            rgba(255, 255, 255, 0.12) var(--timeline-progress),
            rgba(255, 255, 255, 0.12) 100%
          );
      }

      #timelineSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid #38bdf8;
        box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.14);
        cursor: pointer;
      }

      #timelineSlider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid #38bdf8;
        box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.14);
        cursor: pointer;
      }

      .timeline-footer {
        margin-top: 10px;
      }

      #timelineProgressLabel {
        color: #8fe7ff;
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        #scenarioDebugPanel {
          left: 12px;
          right: 12px;
          bottom: 238px;
          max-width: none;
          min-width: 0;
        }

        #timelinePanel {
          width: calc(100vw - 24px);
          bottom: 12px;
          padding: 12px;
        }

        .timeline-summary {
          flex-direction: column;
          align-items: stretch;
        }

        .timeline-controls {
          justify-content: space-between;
        }

        .timeline-current-label {
          font-size: 16px;
        }

        .timeline-edge strong {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header id="header">
      <div class="logo">
        <span>🎮</span>
        <span>Kalk Simulator</span>
      </div>
      <div class="controls">
        <button id="focusScenarioButton" class="action-button">رفتن به محل سناریو</button>
        <a href="#" id="backToDashboard" class="back-button">
          <span>←</span>
          <span>بازگشت به داشبورد</span>
        </a>
      </div>
    </header>
    <div id="scenarioDebugPanel">در حال آماده‌سازی شبیه‌ساز...</div>
    <section id="timelinePanel" aria-label="نوار زمان سناریو">
      <div class="timeline-summary">
        <div class="timeline-current-block">
          <div id="timelineCurrentLabel" class="timeline-current-label">در حال آماده‌سازی زمان سناریو...</div>
          <div id="timelineCurrentSubLabel" class="timeline-current-sublabel">اطلاعات تاریخ و زمان سناریو پس از بارگذاری نمایش داده می‌شود.</div>
        </div>
        <div class="timeline-controls">
          <button id="timelinePlayPauseButton" type="button" class="timeline-control-button primary">توقف</button>
          <button id="timelineStopButton" type="button" class="timeline-control-button secondary">بازپخش</button>
          <label class="timeline-speed-group" for="timelineSpeedSelect">
            <span>سرعت</span>
            <select id="timelineSpeedSelect" class="timeline-speed-select">
              <option value="0.25">۰.۲۵×</option>
              <option value="0.5">۰.۵×</option>
              <option value="1" selected>۱×</option>
              <option value="2">۲×</option>
              <option value="4">۴×</option>
              <option value="8">۸×</option>
            </select>
          </label>
        </div>
      </div>
      <div class="timeline-track-shell">
        <div class="timeline-edge-labels">
          <div class="timeline-edge">
            <span>آغاز</span>
            <strong id="timelineStartLabel">-</strong>
          </div>
          <div class="timeline-edge">
            <span>پایان</span>
            <strong id="timelineEndLabel">-</strong>
          </div>
        </div>
        <div id="timelineTicks"></div>
        <input id="timelineSlider" type="range" min="0" max="1000" step="1" value="0" />
        <div class="timeline-footer">
          <span id="timelineProgressLabel">پیشرفت: ۰٪</span>
          <span id="timelineTimezoneLabel">منطقه زمانی: -</span>
        </div>
      </div>
    </section>
    <div id="splashScreen">
      <video id="splashVideo" autoplay muted playsinline>
        <source src="/splash/splash.mp4" type="video/mp4" />
        مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.
      </video>
      <div id="loading">در حال بارگذاری...</div>
    </div>
    <div id="mainContainer">
      <div id="cesiumContainer"></div>
      <div id="babylonContainer">
        <canvas id="renderCanvas"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
