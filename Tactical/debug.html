<!DOCTYPE html>
<html>
<head>
  <title>Debug UI</title>
  <style>
    body { margin: 0; padding: 0; font-family: monospace; }
    #debug {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: lime;
      padding: 20px;
      z-index: 99999;
      max-width: 400px;
      max-height: 80vh;
      overflow: auto;
      font-size: 12px;
      line-height: 1.5;
    }
    .ok { color: lime; }
    .error { color: red; }
    .warning { color: yellow; }
  </style>
</head>
<body>
  <div id="debug">
    <div style="margin-bottom: 10px; font-weight: bold;">🔍 Debug Info</div>
    <div id="output"></div>
  </div>
  
  <script type="module">
    setTimeout(() => {
      const output = document.getElementById('output');
      let html = '';
      
      // Check elements
      const app = document.getElementById('app');
      const siteContainer = document.querySelector('.site-container');
      const toolbar = document.querySelector('.toolbar');
      const content = document.querySelector('.content');
      const mapContainer = document.getElementById('map-container');
      const map = document.getElementById('map');
      const osd = document.getElementById('osd');
      
      html += '<div><strong>Elements:</strong></div>';
      html += `<div class="${app ? 'ok' : 'error'}">app: ${!!app} ${app ? `(${app.offsetWidth}x${app.offsetHeight})` : ''}</div>`;
      html += `<div class="${siteContainer ? 'ok' : 'error'}">site-container: ${!!siteContainer} ${siteContainer ? `(${siteContainer.offsetWidth}x${siteContainer.offsetHeight})` : ''}</div>`;
      html += `<div class="${toolbar ? 'ok' : 'error'}">toolbar: ${!!toolbar} ${toolbar ? `(${toolbar.offsetWidth}x${toolbar.offsetHeight})` : ''}</div>`;
      html += `<div class="${content ? 'ok' : 'error'}">content: ${!!content} ${content ? `(${content.offsetWidth}x${content.offsetHeight})` : ''}</div>`;
      html += `<div class="${mapContainer ? 'ok' : 'error'}">map-container: ${!!mapContainer} ${mapContainer ? `(${mapContainer.offsetWidth}x${mapContainer.offsetHeight})` : ''}</div>`;
      html += `<div class="${map ? 'ok' : 'error'}">map: ${!!map} ${map ? `(${map.offsetWidth}x${map.offsetHeight})` : ''}</div>`;
      html += `<div class="${osd ? 'ok' : 'error'}">osd: ${!!osd}</div>`;
      
      // Check styles
      if (map) {
        const styles = window.getComputedStyle(map);
        html += '<div style="margin-top: 10px;"><strong>Map Styles:</strong></div>';
        html += `<div>position: ${styles.position}</div>`;
        html += `<div>display: ${styles.display}</div>`;
        html += `<div>visibility: ${styles.visibility}</div>`;
        html += `<div>z-index: ${styles.zIndex}</div>`;
        html += `<div>opacity: ${styles.opacity}</div>`;
      }
      
      if (toolbar) {
        const styles = window.getComputedStyle(toolbar);
        html += '<div style="margin-top: 10px;"><strong>Toolbar Styles:</strong></div>';
        html += `<div>display: ${styles.display}</div>`;
        html += `<div>visibility: ${styles.visibility}</div>`;
        html += `<div>z-index: ${styles.zIndex}</div>`;
        html += `<div>background: ${styles.background}</div>`;
      }
      
      // Check canvas
      const canvas = map?.querySelector('canvas');
      html += '<div style="margin-top: 10px;"><strong>Canvas:</strong></div>';
      html += `<div class="${canvas ? 'ok' : 'error'}">exists: ${!!canvas}</div>`;
      if (canvas) {
        html += `<div>size: ${canvas.width}x${canvas.height}</div>`;
      }
      
      // Check tiles
      const tiles = map?.querySelectorAll('.ol-layer canvas');
      html += `<div>tile canvases: ${tiles?.length || 0}</div>`;
      
      output.innerHTML = html;
      console.log('Debug info updated');
    }, 2000);
  </script>
</body>
</html>
