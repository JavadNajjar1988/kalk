<!DOCTYPE html>
<html>
<head>
  <title>Test Map</title>
  <style>
    body { margin: 0; padding: 0; }
    #info { 
      position: fixed; 
      top: 10px; 
      left: 10px; 
      background: white; 
      padding: 10px; 
      z-index: 1000;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="info">Test Page - Open Console (F12)</div>
  <script type="module">
    // Test if map exists
    setTimeout(() => {
      const mapEl = document.getElementById('map');
      const mapContainer = document.getElementById('map-container');
      const osd = document.getElementById('osd');
      
      console.log('=== MAP TEST ===');
      console.log('map element:', mapEl);
      console.log('map size:', mapEl?.offsetWidth, 'x', mapEl?.offsetHeight);
      console.log('map-container:', mapContainer);
      console.log('map-container size:', mapContainer?.offsetWidth, 'x', mapContainer?.offsetHeight);
      console.log('osd:', osd);
      
      const canvas = mapEl?.querySelector('canvas');
      console.log('canvas:', canvas);
      console.log('canvas size:', canvas?.width, 'x', canvas?.height);
      
      const olViewport = mapEl?.querySelector('.ol-viewport');
      console.log('ol-viewport:', olViewport);
      
      const layers = mapEl?.querySelectorAll('.ol-layer');
      console.log('layers count:', layers?.length);
      
      // Get computed styles
      if (mapEl) {
        const styles = window.getComputedStyle(mapEl);
        console.log('map position:', styles.position);
        console.log('map display:', styles.display);
        console.log('map visibility:', styles.visibility);
      }
      
      if (mapContainer) {
        const styles = window.getComputedStyle(mapContainer);
        console.log('container position:', styles.position);
        console.log('container height:', styles.height);
      }
    }, 2000);
  </script>
</body>
</html>
