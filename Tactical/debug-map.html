<!DOCTYPE html>
<html>
<head>
  <title>Debug Map</title>
  <style>
    body { margin: 0; padding: 0; }
    #debug {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.9);
      color: lime;
      padding: 15px;
      z-index: 99999;
      font-family: monospace;
      font-size: 12px;
      max-width: 400px;
      max-height: 90vh;
      overflow: auto;
    }
    .ok { color: lime; }
    .error { color: red; }
    .warning { color: yellow; }
  </style>
</head>
<body>
  <div id="debug">
    <div style="font-weight: bold; margin-bottom: 10px;">🔍 Map Debug</div>
    <div id="output">Loading...</div>
  </div>
  
  <script>
    setTimeout(() => {
      const output = document.getElementById('output');
      let html = '';
      
      const mapEl = document.getElementById('map');
      const container = document.querySelector('.map-only-container');
      const canvas = mapEl?.querySelector('canvas');
      const olViewport = mapEl?.querySelector('.ol-viewport');
      
      html += '<div><strong>Elements:</strong></div>';
      html += `<div class="${mapEl ? 'ok' : 'error'}">map: ${!!mapEl} ${mapEl ? `(${mapEl.offsetWidth}x${mapEl.offsetHeight})` : ''}</div>`;
      html += `<div class="${container ? 'ok' : 'error'}">container: ${!!container} ${container ? `(${container.offsetWidth}x${container.offsetHeight})` : ''}</div>`;
      html += `<div class="${canvas ? 'ok' : 'error'}">canvas: ${!!canvas} ${canvas ? `(${canvas.width}x${canvas.height})` : ''}</div>`;
      html += `<div class="${olViewport ? 'ok' : 'error'}">ol-viewport: ${!!olViewport}</div>`;
      
      if (mapEl) {
        const styles = window.getComputedStyle(mapEl);
        html += '<div style="margin-top: 10px;"><strong>Map Styles:</strong></div>';
        html += `<div>position: ${styles.position}</div>`;
        html += `<div>display: ${styles.display}</div>`;
        html += `<div>visibility: ${styles.visibility}</div>`;
        html += `<div>width: ${styles.width}</div>`;
        html += `<div>height: ${styles.height}</div>`;
        html += `<div>z-index: ${styles.zIndex}</div>`;
        html += `<div>background: ${styles.background}</div>`;
      }
      
      if (container) {
        const styles = window.getComputedStyle(container);
        html += '<div style="margin-top: 10px;"><strong>Container Styles:</strong></div>';
        html += `<div>position: ${styles.position}</div>`;
        html += `<div>width: ${styles.width}</div>`;
        html += `<div>height: ${styles.height}</div>`;
      }
      
      // Check layers
      const layers = mapEl?.querySelectorAll('.ol-layer');
      html += `<div style="margin-top: 10px;">layers: ${layers?.length || 0}</div>`;
      
      // Check tiles
      const tileCanvases = mapEl?.querySelectorAll('.ol-layer canvas');
      html += `<div>tile canvases: ${tileCanvases?.length || 0}</div>`;
      
      output.innerHTML = html;
    }, 3000);
  </script>
</body>
</html>
