server {
  listen 3000;
  server_name _;

  # آپلود نقشه (mbtiles و …) می‌تواند چند گیگابایت باشد؛ پیش‌فرض nginx ~1m است و 413 می‌دهد.
  client_max_body_size 16g;

  root /usr/share/nginx/html;
  index index.html;

  # Dashboard (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # KalkNegar under /kalknegar/ (SPA)
  location /kalknegar/ {
    alias /usr/share/nginx/html/kalknegar/;
    try_files $uri $uri/ /kalknegar/index.html;
  }

  # Backend API
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7200s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 7200s;
  }

  # TileServer-GL proxy (نقشه‌های MBTiles)
  location /tiles/ {
    proxy_pass http://tileserver:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
  }

  # Simulator assets must NOT fall back to index.html
  location ^~ /simulator/assets/ {
    alias /usr/share/nginx/html/simulator/assets/;
    try_files $uri =404;
  }

  location ^~ /simulator/fonts/ {
    alias /usr/share/nginx/html/simulator/fonts/;
    try_files $uri =404;
  }

  location ^~ /simulator/cesium/ {
    alias /usr/share/nginx/html/simulator/cesium/;
    try_files $uri =404;
  }

  # Simulator (SPA)
  location /simulator/ {
    alias /usr/share/nginx/html/simulator/;
    try_files $uri $uri/ /simulator/index.html;
  }
}

