services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kalk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kalknet

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/static/maps:/app/backend/static/maps:ro
    environment:
      # Prefer loading from .env via --env-file; fallback to default if not provided
      DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@db:5432/kalk}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:3000","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kalknet

  tileserver:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    ports:
      - "8480:8080"
    volumes:
      - ./backend/static/maps:/data:ro
    # Let tileserver-gl auto-discover all .mbtiles in /data so URLs like
    # /data/<filename>/{z}/{x}/{y}.png work for multiple offline maps
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kalknet
    profiles:
      - maps
    depends_on:
      - api

volumes:
  db-data:

networks:
  kalknet:


